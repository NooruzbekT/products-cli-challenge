[project]
name = "products-api"
version = "1.0.0"
description = "Reference Products API for the CLI assignment"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "loguru==0.7.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient can leave anyio lifespan memory-object streams
    # unclosed, emitting ResourceWarnings. Known upstream issue; ignore it.
    "ignore:Unclosed .*MemoryObject.*:ResourceWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
